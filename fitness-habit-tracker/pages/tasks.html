<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Tasks</title>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header" style="display: flex;  padding: 20px;">
            <div class="logo">
                <i class='bx bxs-leaf'></i>
                <span>FocusFlow </span>
                <!-- <img src="../Assets/bxs-leaf.svg" alt="Logo" style="width: 50px; height: 50px; border-radius: 50%;"> -->
            
        </div>

        <div class="sidebar-menu">
            <ul>
                <li><a href="tasks.html" class="active"><i class='bx bx-task'></i> Tasks</a></li>
                <li><a href="habits.html"><i class='bx bx-check-circle'></i> Habits</a></li>
                <li><a href="water.html"><i class='bx bx-water'></i> Water</a></li>
                <li><a href="sleep.html"><i class='bx bx-bed'></i> Sleep</a></li>
                <li><a href="quotes.html"><i class='bx bxs-quote-alt-left'></i> Quotes</a></li>
                <li><a href="pomodoro.html"><i class='bx bx-timer'></i>Pomodoro</a></li>

            </ul>
        </div>


        
    </div>

    <div class="greet">
        <h1>Welcome to FocusFlow!</h1>
        <p>Track your tasks and stay productive!</p>
    </div>

    <div class="task-container">
            <div class="adding-task">
                <h2>My Tasks</h2>
                <ul id="task-list">
                <!-- Task items will be dynamically added here -->
                </ul>
                <input type="text" id="new-task-input" placeholder="What needs to be done?">
                <button id="add-task-button">Add Task</button>
            </div>

            <div class="pending-tasks">
                <h2>Pending Tasks</h2>
                <ul id="pending-task-list">

                   <li> <input type="checkbox" id="task1">
                    <label for="task1">Study javascript</label><br>
                   </li> 

                    <li><input type="checkbox" id="task2">
                        <label for="task2">Go for a walk</label><br>
                    </li>

                    <li><input type="checkbox" id="task3">
                        <label for="task3">Learn Python</label>
                    </li>

                <!-- Pending task items will be dynamically added here -->
                </ul>
            </div>


            <div class="completed-tasks">
                <h2>Completed Tasks</h2>
                <ul id="completed-task-list">

                   <li> <input type="checkbox" id="task1">
                    <label for="task1">Drink water</label><br>
                   </li> 

                    <li><input type="checkbox" id="task2">
                        <label for="task2">Go for a walk</label><br>
                    </li>

                

                <!-- Completed task items will be dynamically added here -->
                </ul>
            </div>

    </div>

    
       

</body>
</html>
