<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Boxicons for simple icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="../css/tasks.css">

    <title>FocusFlow - Tasks</title>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-header">
        <!-- Logo and App Name -->
        <div class="logo">
            <i class='bx bxs-leaf'></i>
            <span>FocusFlow</span>
        </div>
    </div>
<!--sidebar navigation  -->
    <nav class="sidebar-menu">
        
            <a href="tasks.html" class="active"><i class='bx bx-task'></i> 
                <span>Tasks</span></a>
            
            <a href="habits.html"><i class='bx bx-check-circle'></i>
                <span>Habits</span></a>
            
            <a href="water.html"><i class='bx bx-water'></i> 
                <span>Water</span></a>
            <a href="sleep.html"><i class='bx bx-bed'></i> 
                <span>Sleep</span></a>
            <a href="quotes.html"><i class='bx bxs-quote-alt-left'></i> 
                <span>Quotes</span></a>
            <a href="pomodoro.html"><i class='bx bx-timer'></i> 
                <span>Pomodoro</span></a>
        
    </nav>


    <!--bottom part of sidebar-->
    <div class="sidebar-bottom">
        <a href="tasks.html">
            <i class='bx bx-cog'></i>
            <span>Settings</span></a>

    </div>

    </aside>


    <!--Main Content-->

    <header class = "top-header">
        <div class="header-right">
            <span>Thu, 5 sep 2026</span>
            <i class='bx bx-sun'></i>
            <div class="profile">
                <img src="../Assets/profile.jpg" alt="Profile Picture">
            </div>
        </div>
    </header>

    <section class="page-content">
        <div class="page-heading">
            <h1>Tasks</h1>
            <p>Track your tasks and stay productive!</p>
        

            <div class="Daily-progress">
                <strong id="daily-progress">0/0 Completed</strong>
            </div>

        </div>

        <section class="add-task-box">
            <input type="text" id="new-task-input" placeholder="What needs to be done?">
                <button id="add-task-button">Add Task</button>
        </section>

        <!-----Task Section----->

        <div class="task-sections">

            <!-- Pending Tasks -->
             
                <div class="pending-tasks">
                    <h2>Pending Tasks</h2>

                    <ul id="pending-task-list">
                    <!-- JavaScript will add pending tasks here -->
                     </ul>
                </div>


                <div class="completed-tasks">
                     <h2>Completed Tasks</h2>

                    <ul id="completed-task-list">
                        <!-- JavaScript will add completed tasks here -->
                    </ul>
                </div>





        </div>
    </section>



    
</body>
</html>
